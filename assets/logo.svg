<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Elevate Lifestyle and Fitness">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f8f8f"/>
      <stop offset="28%" stop-color="#f2f2f2"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="72%" stop-color="#e3e3e3"/>
      <stop offset="100%" stop-color="#8f8f8f"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffa733"/>
      <stop offset="100%" stop-color="#f7941d"/>
    </linearGradient>
  </defs>

  <!-- orange arch / wing shape -->
  <path d="M60 236 C40 130 145 44 260 44 C375 44 480 130 460 236 C452 240 430 232 418 214 C402 150 340 108 260 108 C180 108 118 150 102 214 C90 232 68 240 60 236 Z"
        fill="url(#amber)" stroke="#e6e6e6" stroke-width="7" stroke-linejoin="round"/>

  <!-- silver platter -->
  <ellipse cx="260" cy="182" rx="178" ry="52" fill="url(#silver)" stroke="#3a3a3a" stroke-width="4"/>

  <!-- ELEVATE wordmark -->
  <text x="260" y="128" text-anchor="middle"
        font-family="Impact, 'Arial Black', Haettenschweiler, sans-serif"
        font-size="86" letter-spacing="2"
        fill="#2b2b2b" stroke="#e8e8e8" stroke-width="4" paint-order="stroke">ELEVATE</text>

  <!-- flexing athlete silhouette -->
  <path d="M258 108 c9 0 16 7 16 16 0 6-3 11-8 14 l14 5 c9 3 15 11 15 21 l0 38 c0 7-5 12-12 12 l-4 0 0 -26 -6 0 0 26 -22 0 0-26 -6 0 0 26 -5 0 c-7 0-12-5-12-12 l0-36 c0-10 6-18 15-22 l13-5 c-5-3-8-8-8-14 0-9 7-16 16-16 z
           M286 128 c10-6 18-16 18-27 0-4 6-4 6 0 0 15-10 28-22 34 z
           M232 136 c-9 4-16 12-16 22 0 4-6 4-6 0 0-13 9-24 20-28 z"
        fill="#1f1f1f"/>

  <!-- taglines -->
  <text x="260" y="248" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif"
        font-size="30" fill="#2b2b2b" stroke="#ffffff" stroke-width="5" paint-order="stroke">LIFESTYLE AND FITNESS</text>
  <g font-family="Impact, 'Arial Black', sans-serif" font-size="19" fill="#2b2b2b" stroke="#ffffff" stroke-width="4" paint-order="stroke" text-anchor="middle">
    <text x="82" y="282">GYM</text>
    <text x="200" y="282">COURT</text>
    <text x="325" y="282">BILLIARDS</text>
    <text x="450" y="282">RECOVERY</text>
  </g>
</svg>
